<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio - João Victor</title>
    <meta name="description" content="Backend Developer — Java & Spring Boot · Golang" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg-base: #0a0a0a;
        --accent-teal: #0d9488;
        --accent-go: #00ACD7;
        --accent-kotlin: #7f52ff;
        --text-primary: #f0f0ee;
        --text-secondary: #8a8a85;
        --text-tertiary: #5a5a55;
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.08);
        --card-bg: rgba(255,255,255,0.03);
      }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', sans-serif;
        color: var(--text-primary);
        background: var(--bg-base);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.5;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at top left, #0d9488 0%, #0a0a0a 55%, #ea5c2b 100%);
        opacity: 0.12;
        z-index: 0;
        pointer-events: none;
      }
      .page {
        position: relative;
        z-index: 1;
        max-width: 1020px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .fade-in {
        opacity: 0;
        transform: translateY(8px);
        animation: fadeInUp 500ms ease forwards;
      }
      @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding-bottom: 2rem;
      }
      .hero-name {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 12px;
      }
      .hero-status { font-size: 13px; color: var(--text-secondary); }
      .lang-java { color: var(--accent-teal); }
      .lang-go { color: var(--accent-go); }
      .lang-kotlin { color: var(--accent-kotlin); }
      .hero-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        margin-top: 24px;
      }
      .hero-links a {
        color: var(--text-secondary);
        text-decoration: none;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0.5px solid var(--border-hover);
        border-radius: 999px;
        transition: transform 200ms ease, color 200ms ease, border-color 200ms ease;
      }
      .hero-links a:hover {
        color: var(--text-primary);
        border-color: rgba(255,255,255,0.18);
        transform: translateY(-1px);
      }
      .hero-links svg {
        width: 16px;
        height: 16px;
      }
      .divider {
        width: 40px;
        height: 1px;
        background: var(--border);
        margin: 2rem auto;
      }
      .projects-section { padding-bottom: 4rem; }
      .section-label {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .projects-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 28px;
      }
      .filter-chip, .new-project-btn, .btn-primary, .btn-ghost, .card-action-btn {
        font-family: 'Inter', sans-serif;
      }
      .filter-chip {
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-secondary);
        background: rgba(255,255,255,0.04);
        border: 0.5px solid var(--border-hover);
        border-radius: 999px;
        padding: 5px 14px;
        cursor: pointer;
      }
      .filter-chip.active { color: var(--text-primary); background: rgba(255,255,255,0.09); }
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        background: var(--card-bg);
        border: 0.5px solid var(--border-hover);
        border-radius: 12px;
        padding: 1.25rem 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        min-height: 220px;
      }
      .card-lang-pill {
        display: inline-flex;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
        align-self: flex-start;
        margin-bottom: 10px;
      }
      .card-lang-pill.java { background: rgba(13,148,136,0.12); color: var(--accent-teal); }
      .card-lang-pill.go { background: rgba(0,172,215,0.12); color: var(--accent-go); }
      .card-lang-pill.kotlin { background: rgba(127,82,255,0.12); color: var(--accent-kotlin); }
      .card-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
      .card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; flex: 1; }
      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 12px;
      }
      .card-tag {
        font-size: 10px;
        color: var(--text-tertiary);
        background: rgba(255,255,255,0.04);
        border: 0.5px solid rgba(255,255,255,0.08);
        border-radius: 4px;
        padding: 2px 7px;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 0.5px solid var(--border);
      }
      .card-link {
        font-size: 12px;
        color: var(--accent-teal);
        text-decoration: none;
      }
      .card.card-go .card-link { color: var(--accent-go); }
      .card.card-kotlin .card-link { color: var(--accent-kotlin); }
      .new-project-btn {
        font-size: 12px;
        color: var(--text-secondary);
        background: none;
        border: 0.5px solid var(--border-hover);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
        display: none;
      }
      body.owner-mode .new-project-btn { display: inline-flex; }
      .footer {
        text-align: center;
        font-size: 11px;
        color: var(--text-tertiary);
        padding: 4rem 0 2rem;
      }
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 90;
        opacity: 0;
        pointer-events: none;
        transition: opacity 300ms ease;
      }
      .drawer-overlay.open { opacity: 1; pointer-events: all; }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 360px;
        height: 100vh;
        background: #111;
        border-left: 0.5px solid var(--accent-teal);
        z-index: 100;
        padding: 2rem 1.5rem;
        transform: translateX(100%);
        transition: transform 300ms ease;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .drawer.open { transform: translateX(0); }
      .drawer-title { font-size: 14px; margin-bottom: 1.5rem; }
      .drawer-field { margin-bottom: 1.25rem; }
      .drawer-field label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      .drawer-field input, .drawer-field select, .drawer-field textarea {
        width: 100%;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background: transparent;
        border: none;
        border-bottom: 0.5px solid var(--border-hover);
        padding: 8px 0;
        outline: none;
      }
      .drawer-field textarea { resize: none; height: 60px; }
      .drawer-actions {
        display: flex;
        gap: 12px;
        margin-top: auto;
        padding-top: 1rem;
      }
      .btn-primary {
        font-size: 12px;
        color: #fff;
        background: var(--accent-teal);
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
      }
      .btn-ghost {
        font-size: 12px;
        color: var(--text-secondary);
        background: none;
        border: 0.5px solid var(--border-hover);
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
      }
      .drawer-field.error input,
      .drawer-field.error select,
      .drawer-field.error textarea { border-bottom-color: #e74c3c; }
      .error-msg {
        font-size: 11px;
        color: #e74c3c;
        margin-top: 4px;
        display: none;
      }
      .drawer-field.error .error-msg { display: block; }
      .owner-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        font-size: 12px;
        color: var(--text-primary);
        background: rgba(13, 148, 136, 0.2);
        border: 0.5px solid rgba(13, 148, 136, 0.4);
        border-radius: 8px;
        padding: 8px 18px;
        z-index: 200;
        opacity: 0;
        transition: opacity 300ms ease, transform 300ms ease;
      }
      .owner-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .owner-only { display: none; }
      body.owner-mode .owner-only { display: inline-flex; }
      .card-actions { display: none; gap: 6px; }
      body.owner-mode .card-actions { display: flex; }
      .card-action-btn {
        font-size: 10px;
        color: var(--text-tertiary);
        background: none;
        border: none;
        cursor: pointer;
      }
      @media (max-width: 800px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 540px) { .projects-grid { grid-template-columns: 1fr; } }
      @media (max-width: 600px) { .drawer { width: 100%; } .page { padding: 0 16px; } }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="hero">
        <h1 class="hero-name fade-in" style="animation-delay: 0ms">João Victor Macedo Neves</h1>
        <p class="hero-status fade-in" style="animation-delay: 100ms">
          Backend Developer · <span class="lang-java">Java</span> & Spring Boot · <span class="lang-go">Golang</span> · <span class="lang-kotlin">Kotlin</span>
        </p>

        <div class="hero-links fade-in" style="animation-delay: 200ms">
          <a href="https://github.com/joaodddev" target="_blank" rel="noopener noreferrer" aria-label="GitHub">

          <a href="https://www.linkedin.com/in/joao-victor-macedo-neves/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5A2.48 2.48 0 1 1 2.5 5.98 2.48 2.48 0 0 1 4.98 3.5zM2.75 8.75h4.46V21.5H2.75zM9.75 8.75h4.27v1.74h.06c.59-1.1 2.04-2.26 4.2-2.26 4.49 0 5.32 2.96 5.32 6.81v6.46h-4.46v-5.73c0-1.37-.02-3.13-1.9-3.13-1.9 0-2.19 1.48-2.19 3.03v5.83H9.75z"/></svg>

        </div>
      </section>

      <div class="divider fade-in" style="animation-delay: 300ms"></div>

      <section class="projects-section">
        <div class="projects-header">
          <span class="section-label fade-in" style="animation-delay: 400ms">Projetos</span>
          <button class="new-project-btn fade-in owner-only" style="animation-delay: 400ms" id="newProjectBtn">+ Novo projeto</button>
        </div>

        <div class="filters fade-in" style="animation-delay: 450ms" id="filtersContainer">
          <button class="filter-chip active" data-filter="all">Todos</button>
          <button class="filter-chip" data-filter="java">Java</button>
          <button class="filter-chip" data-filter="go">Go</button>
          <button class="filter-chip" data-filter="kotlin">Kotlin</button>
          <button class="filter-chip" data-filter="spring">Spring</button>
          <button class="filter-chip" data-filter="kafka">Kafka</button>
          <button class="filter-chip" data-filter="docker">Docker</button>
        </div>

        <div class="projects-grid fade-in" style="animation-delay: 500ms" id="projectsGrid"></div>
      </section>

      <footer class="footer fade-in" style="animation-delay: 600ms">
        João Victor &copy; 2025
      </footer>
    </div>

    <div class="owner-toast" id="ownerToast"></div>
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <div class="drawer" id="drawer">
      <p class="drawer-title">Novo projeto</p>

      <div class="drawer-field" id="fieldName">
        <label for="projectName">Nome do projeto</label>
        <input type="text" id="projectName" placeholder="ex: api-gateway" />
        <span class="error-msg">Informe o nome do projeto</span>
      </div>

      <div class="drawer-field" id="fieldLang">
        <label for="projectLang">Linguagem principal</label>
        <select id="projectLang">
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="kotlin">Kotlin</option>
        </select>
        <span class="error-msg">Selecione a linguagem</span>
      </div>

      <div class="drawer-field" id="fieldTechs">
        <label for="projectTechs">Tecnologias usadas</label>
        <input type="text" id="projectTechs" placeholder="ex: Spring Boot · Kafka · PostgreSQL" />
        <span class="error-msg">Informe as tecnologias</span>
      </div>

      <div class="drawer-field" id="fieldDesc">
        <label for="projectDesc">Descricao curta</label>
        <textarea id="projectDesc" maxlength="120" placeholder="Breve descricao do projeto..."></textarea>
        <span class="error-msg">Informe a descricao</span>
      </div>

      <div class="drawer-field" id="fieldUrl">
        <label for="projectUrl">Link do repositorio</label>
        <input type="url" id="projectUrl" placeholder="https://github.com/..." />
        <span class="error-msg">Informe um link valido</span>
      </div>

      <div class="drawer-actions">
        <button class="btn-primary" id="addProjectBtn">Adicionar card</button>
        <button class="btn-ghost" id="cancelProjectBtn">Cancelar</button>
      </div>
    </div>

    <script>
      (function () {
        var STORAGE_KEY = 'portfolio_projects_v2';
        var OWNER_KEY = 'portfolio_owner';
        var OWNER_PASSPHRASE = 'jvmn';
        var currentFilter = 'all';
        var editingId = null;

        var defaultProjects = [
          { id: '1', name: 'Event-Driven Banking', lang: 'java', tags: ['Java 21', 'Spring Boot', 'Kafka', 'PostgreSQL', 'Docker', 'Microservices'], desc: 'Sistema bancario em microsservicos com transferencias assincronas, idempotencia, retry e arquitetura orientada a eventos.', url: 'https://github.com/joaodddev', featured: true },
          { id: '2', name: 'Notification Worker', lang: 'go', tags: ['Go', 'PostgreSQL', 'Worker Pool', 'Webhooks', 'Docker'], desc: 'Processamento assincrono de notificacoes via webhook com fila persistente, workers concorrentes e graceful shutdown.', url: 'https://github.com/joaodddev', featured: true },
          { id: '3', name: 'Go Auth Gateway', lang: 'go', tags: ['Go', 'Gin', 'JWT', 'Reverse Proxy', 'Docker', 'API Gateway'], desc: 'API Gateway com autenticacao JWT, middleware pipeline e reverse proxy para centralizar autenticacao em microsservicos.', url: 'https://github.com/joaodddev', featured: true },
          { id: '4', name: 'Payment Processor', lang: 'go', tags: ['Go', 'Gin', 'RabbitMQ', 'PostgreSQL', 'Docker', 'Prometheus'], desc: 'Processador de pagamentos com filas, idempotencia, DLQ, retry automatico e observabilidade completa.', url: 'https://github.com/joaodddev', featured: false }
        ];

        var keyBuffer = '';
        var keyTimer = null;

        function isOwner() {
          try { return localStorage.getItem(OWNER_KEY) === '1'; } catch (e) { return false; }
        }

        function setOwner(val) {
          try { localStorage.setItem(OWNER_KEY, val ? '1' : '0'); } catch (e) {}
        }

        function applyOwnerMode() {
          document.body.classList.toggle('owner-mode', isOwner());
        }

        function showToast(msg) {
          var toast = document.getElementById('ownerToast');
          toast.textContent = msg;
          toast.classList.add('visible');
          setTimeout(function () { toast.classList.remove('visible'); }, 2200);
        }

        function loadProjects() {
          try {
            var data = localStorage.getItem(STORAGE_KEY);
            if (data) return JSON.parse(data);
          } catch (e) {}
          return defaultProjects.slice();
        }

        function saveProjects(projects) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch (e) {}
        }

        function createCardEl(project) {
          var isGo = project.lang === 'go';
          var isKotlin = project.lang === 'kotlin';
          var tags = project.tags || [];
          var card = document.createElement('div');
          card.className = 'card' + (isGo ? ' card-go' : '') + (isKotlin ? ' card-kotlin' : '') + (project.featured ? ' featured' : '');
          card.dataset.lang = project.lang;
          card.dataset.tags = tags.map(function (t) { return t.toLowerCase(); }).join(',');
          card.dataset.id = project.id;

          var pill = document.createElement('span');
          pill.className = 'card-lang-pill ' + project.lang;
          pill.textContent = project.lang === 'java' ? 'Java' : (project.lang === 'go' ? 'Go' : 'Kotlin');

          var title = document.createElement('p');
          title.className = 'card-title';
          title.textContent = project.name;

          var desc = document.createElement('p');
          desc.className = 'card-desc';
          desc.textContent = project.desc;

          var tagsEl = document.createElement('div');
          tagsEl.className = 'card-tags';
          var visible = tags.slice(0, 4);
          var overflow = tags.length - 4;
          visible.forEach(function (t) {
            var tag = document.createElement('span');
            tag.className = 'card-tag';
            tag.textContent = t;
            tagsEl.appendChild(tag);
          });
          if (overflow > 0) {
            var more = document.createElement('span');
            more.className = 'card-tag';
            more.textContent = '+' + overflow;
            tagsEl.appendChild(more);
          }

          var footer = document.createElement('div');
          footer.className = 'card-footer';

          var link = document.createElement('a');
          link.className = 'card-link';
          link.href = project.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'GitHub →';

          var actions = document.createElement('div');
          actions.className = 'card-actions';

          var editBtn = document.createElement('button');
          editBtn.className = 'card-action-btn';
          editBtn.textContent = 'Editar';
          editBtn.onclick = function (e) {
            e.stopPropagation();
            openDrawer(project.id);
          };

          var delBtn = document.createElement('button');
          delBtn.className = 'card-action-btn delete';
          delBtn.textContent = 'Excluir';
          delBtn.onclick = function (e) {
            e.stopPropagation();
            if (confirm('Remover este projeto?')) {
              var projects = loadProjects().filter(function (p) { return p.id !== project.id; });
              saveProjects(projects);
              renderProjects();
            }
          };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          footer.appendChild(link);
          footer.appendChild(actions);

          card.appendChild(pill);
          card.appendChild(title);
          card.appendChild(desc);
          card.appendChild(tagsEl);
          card.appendChild(footer);
          return card;
        }

        function renderProjects() {
          var grid = document.getElementById('projectsGrid');
          grid.innerHTML = '';
          loadProjects().forEach(function (p) { grid.appendChild(createCardEl(p)); });
          applyFilter();
        }

        function applyFilter() {
          document.querySelectorAll('#projectsGrid .card').forEach(function (card) {
            if (currentFilter === 'all') {
              card.style.display = '';
            } else if (currentFilter === 'java' || currentFilter === 'go' || currentFilter === 'kotlin') {
              card.style.display = card.dataset.lang === currentFilter ? '' : 'none';
            } else {
              card.style.display = (card.dataset.tags || '').indexOf(currentFilter) >= 0 ? '' : 'none';
            }
          });
        }

        document.querySelectorAll('.filter-chip').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-chip').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            applyFilter();
          });
        });

        var drawer = document.getElementById('drawer');
        var overlay = document.getElementById('drawerOverlay');
        var newBtn = document.getElementById('newProjectBtn');
        var cancelBtn = document.getElementById('cancelProjectBtn');
        var addBtn = document.getElementById('addProjectBtn');

        function clearForm() {
          document.getElementById('projectName').value = '';
          document.getElementById('projectLang').value = 'java';
          document.getElementById('projectTechs').value = '';
          document.getElementById('projectDesc').value = '';
          document.getElementById('projectUrl').value = '';
        }

        function clearErrors() {
          document.querySelectorAll('.drawer-field').forEach(function (f) { f.classList.remove('error'); });
        }

        function openDrawer(projectId) {
          editingId = projectId || null;
          document.querySelector('.drawer-title').textContent = editingId ? 'Editar projeto' : 'Novo projeto';

          if (editingId) {
            var proj = loadProjects().find(function (p) { return p.id === editingId; });
            if (proj) {
              document.getElementById('projectName').value = proj.name;
              document.getElementById('projectLang').value = proj.lang;
              document.getElementById('projectTechs').value = proj.tags.join(', ');
              document.getElementById('projectDesc').value = proj.desc;
              document.getElementById('projectUrl').value = proj.url;
              addBtn.textContent = 'Salvar alteracoes';
            }
          } else {
            clearForm();
            addBtn.textContent = 'Adicionar card';
          }

          drawer.classList.add('open');
          overlay.classList.add('open');
        }

        function closeDrawer() {
          drawer.classList.remove('open');
          overlay.classList.remove('open');
          editingId = null;
          clearErrors();
        }

        newBtn && newBtn.addEventListener('click', function () { openDrawer(); });
        cancelBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);

        function validate() {
          var valid = true;
          clearErrors();

          var name = document.getElementById('projectName').value.trim();
          var techs = document.getElementById('projectTechs').value.trim();
          var desc = document.getElementById('projectDesc').value.trim();
          var url = document.getElementById('projectUrl').value.trim();

          if (!name) { document.getElementById('fieldName').classList.add('error'); valid = false; }
          if (!techs) { document.getElementById('fieldTechs').classList.add('error'); valid = false; }
          if (!desc) { document.getElementById('fieldDesc').classList.add('error'); valid = false; }
          if (!url) { document.getElementById('fieldUrl').classList.add('error'); valid = false; }

          return valid;
        }

        addBtn.addEventListener('click', function () {
          if (!validate()) return;

          var projects = loadProjects();
          var tagsArr = document.getElementById('projectTechs').value.trim().split(/[,·]/).map(function (t) { return t.trim(); }).filter(Boolean);
          var lang = document.getElementById('projectLang').value;

          if (editingId) {
            projects = projects.map(function (p) {
              if (p.id === editingId) {
                return {
                  id: p.id,
                  name: document.getElementById('projectName').value.trim(),
                  lang: lang,
                  tags: tagsArr,
                  desc: document.getElementById('projectDesc').value.trim(),
                  url: document.getElementById('projectUrl').value.trim(),
                  featured: p.featured || false
                };
              }
              return p;
            });
          } else {
            projects.push({
              id: Date.now().toString(),
              name: document.getElementById('projectName').value.trim(),
              lang: lang,
              tags: tagsArr,
              desc: document.getElementById('projectDesc').value.trim(),
              url: document.getElementById('projectUrl').value.trim(),
              featured: false
            });
          }

          saveProjects(projects);
          renderProjects();
          closeDrawer();
        });

        document.addEventListener('keydown', function (e) {
          if (drawer.classList.contains('open')) {
            if (e.key === 'Escape') closeDrawer();
            return;
          }
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

          keyBuffer += e.key.toLowerCase();
          clearTimeout(keyTimer);
          keyTimer = setTimeout(function () { keyBuffer = ''; }, 2000);

          if (keyBuffer === OWNER_PASSPHRASE) {
            keyBuffer = '';
            var newState = !isOwner();
            setOwner(newState);
            applyOwnerMode();
            showToast(newState ? 'Modo editor ativado' : 'Modo editor desativado');
          }
        });

        applyOwnerMode();
        renderProjects();
      })();
    </script>
  </body>
</html>
