      </section>

      <div class="divider fade-in" style="animation-delay: 300ms"></div>

      <section class="projects-section">
        <div class="projects-header">
          <span class="section-label fade-in" style="animation-delay: 400ms">Projetos</span>
          <button class="new-project-btn fade-in owner-only" style="animation-delay: 400ms" id="newProjectBtn">+ Novo projeto</button>
        </div>

        <div class="filters fade-in" style="animation-delay: 450ms" id="filtersContainer">
          <button class="filter-chip active" data-filter="all">Todos</button>
          <button class="filter-chip" data-filter="java">Java</button>
          <button class="filter-chip" data-filter="go">Go</button>
          <button class="filter-chip" data-filter="kotlin">Kotlin</button>
          <button class="filter-chip" data-filter="spring">Spring</button>
          <button class="filter-chip" data-filter="kafka">Kafka</button>
          <button class="filter-chip" data-filter="docker">Docker</button>
        </div>

        <div class="projects-grid fade-in" style="animation-delay: 500ms" id="projectsGrid"></div>
      </section>

      <footer class="footer fade-in" style="animation-delay: 600ms">
        João Victor &copy; 2025
      </footer>
    </div>

    <div class="owner-toast" id="ownerToast"></div>
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <div class="drawer" id="drawer">
      <p class="drawer-title">Novo projeto</p>

      <div class="drawer-field" id="fieldName">
        <label for="projectName">Nome do projeto</label>
        <input type="text" id="projectName" placeholder="ex: api-gateway" />
        <span class="error-msg">Informe o nome do projeto</span>
      </div>

      <div class="drawer-field" id="fieldLang">
        <label for="projectLang">Linguagem principal</label>
        <select id="projectLang">
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="kotlin">Kotlin</option>
        </select>
        <span class="error-msg">Selecione a linguagem</span>
      </div>

      <div class="drawer-field" id="fieldTechs">
        <label for="projectTechs">Tecnologias usadas</label>
        <input type="text" id="projectTechs" placeholder="ex: Spring Boot · Kafka · PostgreSQL" />
        <span class="error-msg">Informe as tecnologias</span>
      </div>

      <div class="drawer-field" id="fieldDesc">
        <label for="projectDesc">Descricao curta</label>
        <textarea id="projectDesc" maxlength="120" placeholder="Breve descricao do projeto..."></textarea>
        <span class="error-msg">Informe a descricao</span>
      </div>

      <div class="drawer-field" id="fieldUrl">
        <label for="projectUrl">Link do repositorio</label>
        <input type="url" id="projectUrl" placeholder="https://github.com/..." />
        <span class="error-msg">Informe um link valido</span>
      </div>

      <div class="drawer-actions">
        <button class="btn-primary" id="addProjectBtn">Adicionar card</button>
        <button class="btn-ghost" id="cancelProjectBtn">Cancelar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
